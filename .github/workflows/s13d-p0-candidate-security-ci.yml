name: S13-D P0 candidate security CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s13d-p0-candidate-security-ci
  cancel-in-progress: false

jobs:
  candidate-security:
    name: Candidate Rules and Auth security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: demo-s13d-ci-emulator-test
      FIREBASE_CONFIG: firebase.s13d-p0-test.json
      HANDWRITING_RULES_FIXTURE: src/test/fixtures/s13d-p0-integrated-candidate.rules
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Functions dependencies
        run: npm --prefix functions ci --legacy-peer-deps

      - name: Build Functions
        run: npm --prefix functions run build

      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Production build
        run: npm run build

      - name: Record candidate Rules and emulator inputs
        shell: bash
        run: |
          echo "rules_path=${HANDWRITING_RULES_FIXTURE}"
          echo "project_id=${FIREBASE_PROJECT_ID}"
          sha256sum "${HANDWRITING_RULES_FIXTURE}"
          echo "auth_host=127.0.0.1:9099"
          echo "firestore_host=127.0.0.1:8081"
          echo "test_config=vitest.s13d-p0.config.ts"

      - name: Run isolated Auth, Firestore, and Functions emulators
        run: >-
          npx firebase emulators:exec
          --only auth,firestore,functions
          --project demo-s13d-ci-emulator-test
          --config firebase.s13d-p0-test.json
          "npx vitest run --config vitest.s13d-p0.config.ts --maxWorkers=1 --no-file-parallelism"
